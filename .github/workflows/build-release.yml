name: Build e Release do Watchdog

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows:
    name: Gerar executável Windows
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Baixar código da tag
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências de build
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validar código Python
        shell: pwsh
        run: python -m py_compile OneConnectWatchdog.py

      - name: Gerar arquivo EXE
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --noconsole `
            --name OneConnectWatchdog `
            OneConnectWatchdog.py

      - name: Gerar checksum SHA-256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\OneConnectWatchdog.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  OneConnectWatchdog.exe" | Set-Content "dist\OneConnectWatchdog.exe.sha256" -Encoding ascii

      - name: Guardar executável na Action
        uses: actions/upload-artifact@v7
        with:
          name: OneConnectWatchdog-${{ github.ref_name }}-Windows
          path: |
            dist/OneConnectWatchdog.exe
            dist/OneConnectWatchdog.exe.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publicar arquivos na Release da tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $repository = "${{ github.repository }}"
          $assets = @(
            "dist\OneConnectWatchdog.exe",
            "dist\OneConnectWatchdog.exe.sha256"
          )

          gh release view $tag --repo $repository *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --repo $repository --clobber
          } else {
            gh release create $tag $assets `
              --repo $repository `
              --verify-tag `
              --generate-notes `
              --title $tag
          }